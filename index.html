<!doctype html>
<!--
  index.html
  La pagina che Vite serve: carica src/main.tsx dentro #root.
  Lingua italiana, titolo e descrizione del portfolio.
  I meta og: e twitter: sono l'anteprima del link su LinkedIn, WhatsApp, Telegram,
  X e Slack (protocollo Open Graph, https://ogp.me). Gli indirizzi sono assoluti,
  perché chi legge la pagina da fuori non conosce il percorso base: l'immagine è
  public/og-image.png, pubblicata accanto alla pagina. Test: tests/og.spec.ts.
-->
<html lang="it">
