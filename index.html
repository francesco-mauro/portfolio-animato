<!doctype html>
<!--
  index.html
  La pagina che Vite serve: carica src/main.tsx dentro #root.
  Titolo e descrizione del portfolio; la lingua scritta qui, italiano, vale finché lo script non sceglie.
  I meta og: e twitter: sono l'anteprima del link su LinkedIn, WhatsApp, Telegram,
  X e Slack (protocollo Open Graph, https://ogp.me). Gli indirizzi sono assoluti,
  perché chi legge la pagina da fuori non conosce il percorso base: l'immagine è
  public/og-image.png, pubblicata accanto alla pagina. Test: tests/og.spec.ts.
  Lo script nella testa della pagina sceglie il tema chiaro o scuro prima che la
  pagina si disegni (niente tag scritti qui: Vite li cercherebbe anche nei commenti),
  così non c'è il lampo del tema sbagliato: la scelta salvata da ThemeToggle se c'è,
  altrimenti quella del sistema. Test: tests/theme.spec.ts.
  Lo stesso script sceglie la lingua e la scrive sull'attributo lang della pagina: la
  scelta salvata da LanguageToggle se c'è, altrimenti la lingua del browser, italiano se
  il browser è in italiano e inglese per tutti gli altri. Da lì la legge React
  (src/context/LanguageContext.tsx). Test: tests/language.spec.ts.
  Descrizione e anteprima del link restano in italiano in tutte e due le lingue:
  chi prepara l'anteprima di un link (LinkedIn, WhatsApp, Telegram) non esegue JavaScript.
-->
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Francesco Mauro, junior full stack developer a Roma. Progetti in React, TypeScript, Vue.js e Node.js." />
    <title>Francesco Mauro · Junior Full Stack Developer</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var saved = localStorage.getItem('theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
      var lang = /^it\b/i.test(navigator.language || '') ? 'it' : 'en'
      try {
        var savedLang = localStorage.getItem('lang')
        if (savedLang === 'it' || savedLang === 'en') lang = savedLang
      } catch (e) {}
      document.documentElement.lang = lang
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://francesco-mauro.github.io/portfolio-animato/" />
    <meta property="og:site_name" content="Francesco Mauro" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="Francesco Mauro · Junior Full Stack Developer" />
    <meta property="og:description" content="Portfolio animato in React e TypeScript: progetti in React, Vue.js e Node.js, a Roma." />
    <meta property="og:image" content="https://francesco-mauro.github.io/portfolio-animato/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Francesco Mauro, Junior Full Stack Developer a Roma: React, TypeScript, Vue.js, Node.js" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
