# deploy.yml
# Pubblica il sito su GitHub Pages a ogni push sul ramo main (o a mano da Actions).
# Due job: "build" installa le dipendenze con npm ci, controlla il codice (lint),
# lancia i test dei dati con Vitest (npm run test:unit), compila (npm run build),
# lancia i test end-to-end con Playwright e carica la cartella dist/; "deploy" la
# pubblica su Pages. Un test rosso, dei dati o end-to-end, ferma la pubblicazione.
# Nelle impostazioni del repository, Pages deve avere come sorgente "GitHub Actions".
# Le azioni sono alle versioni che girano su Node 24 (Node 20 è deprecato da GitHub), aggiornate
# il 13 novembre 2026: lo controlla .github/workflows.test.ts, dentro npm run test:unit.
# upload-pages-artifact dalla v4 lascia fuori i file nascosti: dist/ non ne ha.
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
