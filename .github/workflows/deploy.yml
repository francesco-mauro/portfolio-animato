# deploy.yml
# Pubblica il sito su GitHub Pages a ogni push sul ramo main (o a mano da Actions).
# Due job: "build" installa le dipendenze con npm ci, controlla il codice (lint),
# compila (npm run build) e carica la cartella dist/; "deploy" la pubblica su Pages.
# Nelle impostazioni del repository, Pages deve avere come sorgente "GitHub Actions".
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
